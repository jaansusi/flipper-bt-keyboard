name: Flipper app

# Builds remote_keyboard.fap against the latest official release firmware SDK on
# every push and pull request. Pushing a tag vX.Y (matching fap_version in
# application.fam) also publishes a GitHub release whose notes list the commits
# since the previous tag.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "flipper/**"
      - ".github/workflows/flipper-app.yml"
  pull_request:
    paths:
      - "flipper/**"
      - ".github/workflows/flipper-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report logic tests
        run: make -C flipper/test test

  build:
    needs: unit-tests
    runs-on: ubuntu-latest
    env:
      UFBT_HOME: ${{ github.workspace }}/.ufbt
    outputs:
      sdk-version: ${{ steps.sdk.outputs.version }}
      api-version: ${{ steps.sdk.outputs.api }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ufbt and the latest release SDK
        run: |
          pip install ufbt
          ufbt update --hw-target f7 --channel release

      - name: Read SDK version
        id: sdk
        run: |
          echo "version=$(python3 -c 'import json, os; print(json.load(open(os.environ["UFBT_HOME"] + "/current/ufbt_state.json"))["version"])')" >> "$GITHUB_OUTPUT"
          echo "api=$(grep -m1 '^Version,' "$UFBT_HOME/current/sdk_headers/f7_sdk/targets/f7/api_symbols.csv" | cut -d, -f3)" >> "$GITHUB_OUTPUT"

      # clang-format check; the Apps Catalog rejects unformatted code
      - name: Lint
        working-directory: flipper/remote_keyboard
        run: ufbt lint

      - name: Build
        working-directory: flipper/remote_keyboard
        run: ufbt

      - uses: actions/upload-artifact@v4
        with:
          name: remote_keyboard
          path: flipper/remote_keyboard/dist/remote_keyboard.fap
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags, for the changelog
          fetch-depth: 0

      - name: Check tag matches fap_version
        run: |
          version=$(sed -n 's/.*fap_version="\([^"]*\)".*/\1/p' flipper/remote_keyboard/application.fam)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match fap_version=\"$version\" in application.fam"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: remote_keyboard
          path: out

      - name: Write changelog
        env:
          SDK_VERSION: ${{ needs.build.outputs.sdk-version }}
          API_VERSION: ${{ needs.build.outputs.api-version }}
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          range="${previous:+$previous..}$GITHUB_REF_NAME"
          {
            echo "## Changes"
            echo
            git log --no-merges --reverse --pretty='- %s (%h)' "$range"
            echo
            if [ -n "$previous" ]; then
              echo "**Full diff:** https://github.com/$GITHUB_REPOSITORY/compare/$previous...$GITHUB_REF_NAME"
              echo
            fi
            echo "Built for official firmware $SDK_VERSION (API $API_VERSION)."
          } > notes.md
          cat notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 0.x versions are pre-releases
          prerelease=""
          case "$GITHUB_REF_NAME" in v0.*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" out/remote_keyboard.fap \
            --title "Remote Keyboard $GITHUB_REF_NAME" \
            --notes-file notes.md $prerelease
