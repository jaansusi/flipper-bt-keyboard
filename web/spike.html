<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pairing Spike</title>
<!-- Throwaway page for plan step 04: does the first rejected write trigger OS pairing? -->
<style>
  :root { --bg: #fff; --fg: #111; --muted: #666; --ok: #0a7d32; --err: #b3261e; --border: #ccc; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111; --fg: #eee; --muted: #999; --ok: #5fd38a; --err: #ff8a80; --border: #444; }
  }
  body { background: var(--bg); color: var(--fg); font: 16px/1.4 system-ui, sans-serif; margin: 0; padding: 16px; }
  button { font: inherit; padding: 12px 20px; margin: 0 8px 8px 0; }
  #log { font: 13px/1.5 ui-monospace, monospace; white-space: pre-wrap; word-break: break-word;
         border: 1px solid var(--border); padding: 8px; min-height: 200px; }
  .ok { color: var(--ok); } .err { color: var(--err); } .muted { color: var(--muted); }
</style>
</head>
<body>
<h1>Pairing Spike</h1>
<p class="muted">Start Remote Keyboard on the Flipper, then press Connect. If the device is not
paired, the OS should ask for the PIN shown on the Flipper.</p>
<button id="connect">Connect</button>
<button id="type-a" disabled>Type "a"</button>
<button id="clear">Clear log</button>
<div id="log"></div>

<script type="module">
const SERVICE_UUID = "ff6ad5ee-6d0c-4067-9f0b-25935584962d";
const KEY_REPORT_UUID = "82e449f4-1910-47dd-bb18-a697f0e81a9c";
const ZERO = new Uint8Array(8);
const A_PRESS = new Uint8Array([0, 0, 0x04, 0, 0, 0, 0, 0]);

const logEl = document.getElementById("log");
const typeButton = document.getElementById("type-a");
let characteristic = null;
const t0 = performance.now();

function log(message, cls = "") {
  const line = document.createElement("div");
  line.className = cls;
  line.textContent = `[${((performance.now() - t0) / 1000).toFixed(2)}s] ${message}`;
  logEl.append(line);
}

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

async function writeZero(label) {
  try {
    await characteristic.writeValueWithResponse(ZERO);
    log(`${label}: zero report written`, "ok");
    return true;
  } catch (e) {
    log(`${label}: write failed: ${e.name}: ${e.message}`, "err");
    return false;
  }
}

document.getElementById("connect").addEventListener("click", async () => {
  try {
    log(`navigator.bluetooth: ${"bluetooth" in navigator ? "present" : "MISSING"}`);
    if (!("bluetooth" in navigator)) return;
    log(`getAvailability(): ${await navigator.bluetooth.getAvailability()}`);

    const device = await navigator.bluetooth.requestDevice({ filters: [{ services: [SERVICE_UUID] }] });
    log(`chosen device: ${device.name ?? "(no name)"}`);
    device.addEventListener("gattserverdisconnected", () => {
      log("gattserverdisconnected", "err");
      typeButton.disabled = true;
    });

    const server = await device.gatt.connect();
    log("GATT connected");
    const service = await server.getPrimaryService(SERVICE_UUID);
    characteristic = await service.getCharacteristic(KEY_REPORT_UUID);
    const p = characteristic.properties;
    log(`characteristic properties: write=${p.write} writeWithoutResponse=${p.writeWithoutResponse} read=${p.read} notify=${p.notify}`);

    // SPEC §7.2 step 3: first write triggers pairing if not bonded; retry once.
    if (!(await writeZero("first write"))) {
      log("waiting 3 s for pairing, then retrying…");
      await sleep(3000);
      if (!server.connected) {
        log("reconnecting GATT…");
        await device.gatt.connect();
        characteristic = await (await device.gatt.getPrimaryService(SERVICE_UUID)).getCharacteristic(KEY_REPORT_UUID);
      }
      if (!(await writeZero("retry"))) return;
    }
    log("READY", "ok");
    typeButton.disabled = false;
  } catch (e) {
    log(`${e.name}: ${e.message}`, "err");
  }
});

typeButton.addEventListener("click", async () => {
  try {
    await characteristic.writeValueWithResponse(A_PRESS);
    await characteristic.writeValueWithResponse(ZERO);
    log("typed a", "ok");
  } catch (e) {
    log(`${e.name}: ${e.message}`, "err");
  }
});

document.getElementById("clear").addEventListener("click", () => logEl.replaceChildren());
log(navigator.userAgent, "muted");
</script>
</body>
</html>
